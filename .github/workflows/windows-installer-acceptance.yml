name: Windows final installer acceptance

on:
  push:
    branches: [codex/desktop-managed-agent, codex/milocode-computer-use]
    paths:
      - .github/workflows/windows-installer-acceptance.yml
      - scripts/windows-installer-acceptance.ps1
      - scripts/test/windows-installer-cdp.test.ps1
      - scripts/windows-computer-use-acceptance.mjs
      - scripts/windows-native-setup-diagnostic.mjs
      - scripts/test/windows-computer-use-acceptance.test.mjs
      - scripts/test/windows-native-setup-diagnostic.test.mjs
      - windows-installer-acceptance.json
  workflow_dispatch:
    inputs:
      sha256:
        description: Final installer EXE SHA256 (leave empty to use the tracked manifest)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: windows-final-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  final-installer:
    if: github.repository == 'baisuipingan/ZCode' && (github.ref == 'refs/heads/codex/desktop-managed-agent' || github.ref == 'refs/heads/codex/milocode-computer-use' || github.ref == 'refs/heads/codex/milocode-stop')
    # GitHub only exposes draft releases to identities with repository push access.
    # This job needs that visibility to test the exact asset before publishing it.
    permissions:
      contents: write
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out acceptance scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare an isolated acceptance directory
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'milocode-windows-acceptance'
          "ACCEPTANCE_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify CDP transport output contract
        run: ./scripts/test/windows-installer-cdp.test.ps1

      - name: Verify Computer Use acceptance transport
        run: node --test scripts/test/windows-computer-use-acceptance.test.mjs scripts/test/windows-native-setup-diagnostic.test.mjs

      - name: Download the final Draft Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content windows-installer-acceptance.json -Raw | ConvertFrom-Json
          if ($manifest.repository -ne 'baisuipingan/ZCode' -or
              $manifest.version -notmatch '^3\.17\.[0-9]+$' -or
              $manifest.releaseTag -ne "milocode-v$($manifest.version)" -or
              $manifest.assetName -ne "MiloCode-$($manifest.version)-win-x64.exe") {
            throw 'The final installer source must remain the fixed 3.17.8 release asset.'
          }
          New-Item -ItemType Directory -Path $env:ACCEPTANCE_ROOT -Force | Out-Null
          gh release download $manifest.releaseTag --repo $manifest.repository --pattern $manifest.assetName --dir $env:ACCEPTANCE_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Downloading the final installer failed.' }

      - name: Verify wizard, install, renderer and uninstall
        env:
          ACCEPTANCE_SHA256: ${{ inputs.sha256 }}
        run: |
          $manifest = Get-Content windows-installer-acceptance.json -Raw | ConvertFrom-Json
          ./scripts/windows-installer-acceptance.ps1 `
            -InstallerPath (Join-Path $env:ACCEPTANCE_ROOT $manifest.assetName) `
            -Sha256 $env:ACCEPTANCE_SHA256 `
            -WorkRoot (Join-Path $env:ACCEPTANCE_ROOT 'run')

      - name: Upload installer acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milocode-windows-final-acceptance-${{ github.run_id }}
          path: ${{ env.ACCEPTANCE_ROOT }}/run/evidence/
          if-no-files-found: warn
          retention-days: 14
